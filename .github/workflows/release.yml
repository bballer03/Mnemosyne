name: Release

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate Tag Version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag_version: ${{ steps.validate.outputs.tag_version }}
      workspace_version: ${{ steps.validate.outputs.workspace_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Validate tag matches workspace version
        id: validate
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '.packages[] | select(.name == "mnemosyne-cli") | .version'
          )"

          if [[ -z "${workspace_version}" || "${workspace_version}" == "null" ]]; then
            echo "Failed to read mnemosyne-cli version from cargo metadata" >&2
            exit 1
          fi

          if [[ "${tag_version}" != "${workspace_version}" ]]; then
            echo "Tag version v${tag_version} does not match Cargo.toml version ${workspace_version}" >&2
            exit 1
          fi

          echo "tag_version=${tag_version}" >> "${GITHUB_OUTPUT}"
          echo "workspace_version=${workspace_version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: validate-version
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
            archive_name: mnemosyne-cli-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            archive_name: mnemosyne-cli-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive_name: mnemosyne-cli-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            use_cross: false
            archive_name: mnemosyne-cli-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            archive_name: mnemosyne-cli-x86_64-pc-windows-msvc.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Add Rust target
        if: ${{ !matrix.use_cross }}
        run: rustup target add "${{ matrix.target }}"

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build mnemosyne-cli
        run: |
          set -euo pipefail

          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p mnemosyne-cli
          else
            cargo build --release --target "${{ matrix.target }}" -p mnemosyne-cli
          fi

      - name: Package binary
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/mnemosyne-cli.exe" ./mnemosyne-cli.exe
            7z a "${{ matrix.archive_name }}" ./mnemosyne-cli.exe
          else
            cp "target/${{ matrix.target }}/release/mnemosyne-cli" ./mnemosyne-cli
            tar czf "${{ matrix.archive_name }}" ./mnemosyne-cli
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  build-desktop:
    name: Build Desktop Installer ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: validate-version
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            tauri_args: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            tauri_args: ""
          - target: x86_64-apple-darwin
            runner: macos-latest
            tauri_args: "--target x86_64-apple-darwin"
          - target: aarch64-apple-darwin
            runner: macos-latest
            tauri_args: "--target aarch64-apple-darwin"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            tauri_args: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install Linux bundler dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # Slice 16.B — code-signing is conditional on GitHub Actions secrets.
      # Each platform step logs loudly when secrets are absent so maintainers
      # know exactly where to plug in real certificates later.
      - name: Desktop auto-update (v1 decision)
        run: |
          echo "M16 16.B: Desktop auto-update SKIPPED for v1 — no Tauri updater plugin is wired."
          echo "Users re-download installers from GitHub Releases (same as the CLI today)."
          echo "Revisit after a full code-signing + update-signing trust chain is in place."

      - name: Resolve code-signing (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "M16 16.B: Linux desktop bundles (.deb/.AppImage/.rpm) ship unsigned by design."
          echo "No OS-level signing gate applies on Linux — no GitHub secrets required."

      - name: Resolve code-signing (Windows)
        if: ${{ runner.os == 'Windows' }}
        id: win-signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${WINDOWS_CERTIFICATE:-}" && -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "secrets_present=true" >> "${GITHUB_OUTPUT}"
            echo "M16 16.B: WINDOWS_CERTIFICATE secrets present — will import PFX and wire Tauri signing next."
          else
            echo "secrets_present=false" >> "${GITHUB_OUTPUT}"
            echo "M16 16.B: WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets NOT configured."
            echo "Shipping UNSIGNED Windows installer (.msi/.exe)."
            echo "Windows SmartScreen will warn on first run — see SECURITY.md for the workaround."
          fi

      - name: Import Windows code-signing certificate and wire Tauri signing
        if: ${{ runner.os == 'Windows' && steps.win-signing.outputs.secrets_present == 'true' }}
        id: win-signing-config
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt

          $pfxPassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $pfxPassword | Out-Null

          $pfxData = Get-PfxData -FilePath certificate/certificate.pfx -Password $pfxPassword
          $thumbprint = $pfxData.EndEntityCertificates[0].Thumbprint
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            Write-Error "Failed to resolve Windows certificate thumbprint from imported PFX"
            exit 1
          }

          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.comodoca.com" }
          $confPath = "tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $conf.bundle) {
            $conf | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{})
          }
          $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            certificateThumbprint = $thumbprint
            digestAlgorithm     = "sha256"
            timestampUrl        = $timestampUrl
          }) -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding utf8

          "WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "M16 16.B: Windows Authenticode signing ENABLED — PFX imported; thumbprint wired to tauri.conf.json (digest=sha256, timestamp=$timestampUrl)."

      - name: Resolve code-signing (macOS)
        if: ${{ runner.os == 'macOS' }}
        id: mac-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "secrets_present=true" >> "${GITHUB_OUTPUT}"
            echo "M16 16.B: Apple signing/notarization secrets present — will validate Developer ID Application certificate after import."
          else
            echo "secrets_present=false" >> "${GITHUB_OUTPUT}"
            echo "M16 16.B: Apple signing/notarization secrets NOT configured."
            echo "Required when enabling (Apple-ID path): APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,"
            echo "APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, KEYCHAIN_PASSWORD."
            echo "Shipping UNSIGNED macOS bundle (.dmg/.app)."
            echo "macOS Gatekeeper will block on first open — use Right-click → Open. See SECURITY.md."
          fi

      - name: Import Apple Developer certificate
        if: ${{ runner.os == 'macOS' && steps.mac-signing.outputs.secrets_present == 'true' }}
        id: mac-cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "${APPLE_CERTIFICATE}" | base64 -D > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" build.keychain

          IDENTITIES="$(security find-identity -v -p codesigning build.keychain)"
          CERT_ID="$(
            echo "${IDENTITIES}" \
              | grep 'Developer ID Application' \
              | head -1 \
              | awk -F'"' '{print $2}' \
              || true
          )"
          if [[ -n "${CERT_ID}" ]]; then
            echo "signing_enabled=true" >> "${GITHUB_OUTPUT}"
            echo "APPLE_SIGNING_IDENTITY=${CERT_ID}" >> "${GITHUB_ENV}"
            echo "M16 16.B: macOS code signing + Apple-ID notarization ENABLED — Developer ID Application identity: ${CERT_ID}"
          elif echo "${IDENTITIES}" | grep -q 'Apple Development'; then
            echo "signing_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "M16 16.B: Apple Development certificate detected — NOT valid for release notarization." >&2
            echo "Direct distribution requires a Developer ID Application certificate." >&2
            echo "Shipping UNSIGNED macOS bundle (.dmg/.app)." >&2
            echo "macOS Gatekeeper will block on first open — use Right-click → Open. See SECURITY.md." >&2
          else
            echo "Failed to resolve Developer ID Application signing identity from imported certificate" >&2
            exit 1
          fi

      - name: Build Tauri bundle
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple env vars are consumed by tauri-cli only when mac-cert validated Developer ID Application.
          # Windows signing uses bundle.windows.* injected into tauri.conf.json after PFX import.
          APPLE_CERTIFICATE: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.mac-cert.outputs.signing_enabled == 'true' && env.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: tauri
          args: ${{ matrix.tauri_args }}
          # No tagName/releaseId: build-only mode. The `release` job below
          # attaches these bundles to the same tagged release the CLI
          # archives publish to, via artifactPaths + upload-artifact.

      - name: Upload desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}
          if-no-files-found: error

      - name: Package Windows portable zip
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.validate-version.outputs.tag_version }}"
          # Prefer the release output tree; the packaging script searches recursively for Mnemosyne.exe.
          $candidates = @(
            "tauri/target/release",
            "tauri/target/x86_64-pc-windows-msvc/release"
          )
          $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) {
            Write-Error "No Tauri release output directory found for portable packaging"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          & .\scripts\release\package_windows_portable.ps1 `
            -Version $version `
            -SourceDir $source `
            -OutDir dist-portable

      - name: Upload Windows portable zip
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-portable
          path: dist-portable/Mnemosyne-*-windows-x64-portable.zip
          if-no-files-found: error

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate-version
    permissions: { packages: write }
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mnemosyne
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-version.outputs.tag_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-version.outputs.tag_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate-version.outputs.tag_version }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - build
      - build-desktop
      - docker
    permissions: { contents: write }
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Download desktop installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      # M21.B/C/D — Checksums + warn-mode name verify (WSL-safe; not launch proof).
      # Emits SHA256SUMS (+ asset-manifest.json) for desktop-like files in dist/.
      # Verifier runs with --allow-warnings until macOS/AppImage name normalization
      # and a strict fail-closed gate land (21.C/D/F). Green here ≠ GUI launch-tested.

      - name: Generate desktop SHA256SUMS
        env:
          TAG_VERSION: ${{ needs.validate-version.outputs.tag_version }}
        run: |
          set -euo pipefail
          python3 scripts/release/generate_sha256sums.py \
            --dist dist \
            --desktop-only \
            --version "${TAG_VERSION}" \
            --output dist/SHA256SUMS \
            --manifest auto
          echo "SHA256SUMS (desktop artifacts; not launch proof):"
          cat dist/SHA256SUMS

      - name: Verify desktop assets (warn mode)
        env:
          TAG_VERSION: ${{ needs.validate-version.outputs.tag_version }}
        run: |
          set -euo pipefail
          # Warn-only: missing frozen primaries / transitional Tauri names are
          # expected until 21.C/D normalize uploads. Does not fail the release.
          python3 scripts/release/verify_desktop_assets.py \
            --dist dist \
            --version "${TAG_VERSION}" \
            --allow-warnings

      - name: Resolve release notes path
        id: notes
        env:
          TAG_VERSION: ${{ needs.validate-version.outputs.tag_version }}
        run: |
          set -euo pipefail

          notes_path="docs/release-notes-v${TAG_VERSION}.md"

          if [[ ! -f "${notes_path}" ]]; then
            echo "Hand-crafted release notes not found at ${notes_path}" >&2
            echo "The release-prep workflow must produce this file before tagging." >&2
            echo "See .github/prompts/release-prep.prompt.md." >&2
            exit 1
          fi

          echo "notes_path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          # Hand-crafted notes are the source of truth (produced by release-prep).
          # Auto-generated notes are intentionally disabled to avoid duplicate / inconsistent release bodies.
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.notes_path }}
          files: dist/*
          fail_on_unmatched_files: true