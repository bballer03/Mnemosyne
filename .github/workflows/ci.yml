name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui-check:
    name: UI Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin: CI Bun 1.4.x hung mid-batch on NaturalLanguageInputBar after
          # heavy WorkflowCard/TopNav suites (job SIGTERM ~90s). Pin keeps the
          # UI gate aligned with the verified local runner. ui/run-tests.ts
          # enforces per-batch RSS ceilings and names the batch on timeout/SIGTERM.
          bun-version: "1.2.5"

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Run UI tests
        working-directory: ui
        run: bun run test

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Typecheck UI
        working-directory: ui
        run: bun run lint

  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo check
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all -- --check

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate Docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mnemosyne:ci-test
          build-args: |
            VERSION=ci-test

  # Tauri is excluded from the root Cargo workspace, so `cargo check --workspace`
  # never compiles the desktop host. Catch compile/link regressions on PR/main
  # before tagged release builds (which bundle installers on 5 OS/arch targets).
  desktop-check:
    name: Desktop Tauri Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "tauri -> target"

      - name: Install Linux Tauri dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.5"

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build UI (Tauri frontend assets)
        working-directory: ui
        run: bun run build

      - name: Cargo check desktop host
        working-directory: tauri
        run: cargo check --locked

      - name: Cargo test desktop host (unit)
        working-directory: tauri
        run: cargo test --locked --bins -- --nocapture
