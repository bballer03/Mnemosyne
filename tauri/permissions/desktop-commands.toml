[[permission]]
identifier = "allow-desktop-commands"
description = "Enables all Mnemosyne desktop heap / workflow / assistant IPC commands for the main window."
commands.allow = [
  "pick_heap_file",
  "load_heap_from_source",
  "run_desktop_analysis",
  "run_ci_check",
  "generate_desktop_flamegraph",
  "load_heap",
  "unload_heap",
  "get_references",
  "get_referrers",
  "query_heap",
  "regroup_histogram",
  "list_class_instances",
  "explain_leak",
  "inspect_object",
  "find_all_gc_paths",
  "diff_objects",
  "find_gc_path",
  "map_to_code",
  "propose_fix",
  "describe_workflow",
  "start_workflow",
  "next_step",
  "get_workflow",
  "close_workflow",
  "create_ai_session",
  "resume_ai_session",
  "get_ai_session",
  "close_ai_session",
  "chat_session",
  "list_snapshots",
  "save_snapshot",
  "remove_snapshot",
  "open_snapshot",
  "get_desktop_log_path",
]
