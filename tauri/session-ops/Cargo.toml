[package]
name = "mnemosyne-desktop-session"
version = "0.4.2"
edition = "2021"
description = "Session-scoped heap operations for the Mnemosyne desktop shell"
license = "Apache-2.0"

[dependencies]
mnemosyne-core = { path = "../../core" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"

[features]
test-fixtures = ["mnemosyne-core/test-fixtures"]
