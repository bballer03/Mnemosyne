[workspace]
# Empty table: explicitly opts this crate out of any ancestor workspace.
# Without this, `cargo`'s upward directory search can cross into an
# unrelated parent Cargo.toml (e.g. when this crate is checked out inside
# a nested git worktree under the main repo tree) whose `workspace.exclude`
# entry for "tauri" is anchored at *that* root and therefore does not match
# this path, producing a "believes it's in a workspace when it's not" error.
# The root Cargo.toml's `exclude = ["ui", "tauri"]` still governs the
# common case; this table is a belt-and-suspenders guard for nested checkouts.

[package]
name = "mnemosyne-desktop"
version = "0.4.2"
edition = "2021"
description = "Mnemosyne desktop app - native JVM heap analysis"
license = "Apache-2.0"

[dependencies]
mnemosyne-core = { path = "../core" }
mnemosyne-desktop-session = { path = "session-ops" }
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "5"
tauri-plugin-dialog = "2"
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "mnemosyne-desktop"
path = "src/main.rs"
